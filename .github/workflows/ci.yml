name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: lint + type + test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - run: uv build
      - run: uv run pytest -q

  minimal-install:
    name: minimal wheel install (no extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: uv build
      - name: install wheel with only runtime deps
        run: |
          python -m venv /tmp/minvenv
          /tmp/minvenv/bin/pip install dist/data_sentinel_forge-*.whl
      - name: core must work without optional extras
        run: |
          /tmp/minvenv/bin/python -c "
          import data_sentinel
          from data_sentinel.core.contracts import DiagnosticReport
          from data_sentinel.diagnostics.capabilities import all_descriptors
          from data_sentinel.analyzers.spark.plans.parser import parse_plan
          print('minimal install OK')
          "
          /tmp/minvenv/bin/data-sentinel --help > /dev/null
          /tmp/minvenv/bin/data-sentinel capabilities > /dev/null
          echo "CLI OK without extras"
