[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-sentinel"
dynamic = ["version"]
description = "Data Sentinel — Intelligent Data Engineering & Agentic Diagnostics Platform"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "EdgarSocrates98" }]
keywords = ["data-engineering", "spark", "glue", "diagnostics", "sql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.7,<3",
    "typer>=0.12",
    "sqlglot>=25",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
stats = ["numpy>=1.26", "scipy>=1.11"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "jsonschema>=4.21",
]
mcp = [
    "mcp>=1.9",
]

[dependency-groups]
# Auto-installed by `uv sync` (uv-native dev workflow).
# Kept in sync with the `dev` optional-dependency extra above, which serves
# `pip install -e ".[dev]"` users.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "jsonschema>=4.21",
    "boto3>=1.34",
    "boto3-stubs[glue,logs,cloudwatch]>=1.34",
    "pytest-benchmark>=4.0",
    "types-pyyaml>=6.0.12.20260906",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.scripts]
data-sentinel = "data_sentinel.cli:app"

[project.urls]
Repository = "https://github.com/EdgarSocrates98/data-sentinel-forge"
Issues = "https://github.com/EdgarSocrates98/data-sentinel-forge/issues"

[tool.hatch.version]
path = "src/data_sentinel/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/data_sentinel"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "schemas", "README.md", "LICENSE"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B", "SIM", "RUF",
    "S", "A", "C4", "DTZ", "T20", "PTH",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["T20"]
# Vendored canonical installkit — byte-identical to
# the-forge/scripts/installkit (drift-checked via _SOURCE_SHA256).
"src/data_sentinel/_installkit.py" = ["ALL"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["data_sentinel"]
plugins = ["pydantic.mypy"]
# Canonical vendored copy — same rationale as the lint exclusion.
exclude = ["data_sentinel._installkit"]

[tool.pytest.ini_options]
markers = ["slow: testes de integração pesados (venv limpa etc.)"]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["data_sentinel"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
